<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Subtle Grid lines / Waves -->
  <circle cx="256" cy="256" r="180" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none"/>
  <circle cx="256" cy="256" r="220" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>

  <!-- Video Camera Body -->
  <rect x="130" y="170" width="170" height="172" rx="36" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Camera Lens details -->
  <circle cx="215" cy="256" r="46" fill="url(#bgGrad)"/>
  <circle cx="215" cy="256" r="24" fill="#ffffff" opacity="0.9"/>
  <circle cx="225" cy="246" r="8" fill="url(#accentGrad)"/>
  
  <!-- Camera Projection / Cone -->
  <path d="M320 220 L382 178 C392 170 402 176 402 188 L402 324 C402 336 392 342 382 334 L320 292 Z" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Live Signal Dot -->
  <circle cx="280" cy="190" r="10" fill="#22c55e"/>
</svg>
